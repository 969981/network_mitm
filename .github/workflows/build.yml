name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Git safe.directory
        run: git config --system --add safe.directory "$PWD"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build pinned libnx
        run: |
          set -euxo pipefail
          git clone https://github.com/switchbrew/libnx.git /tmp/libnx
          git -C /tmp/libnx checkout feebd026ca0f5dcc2119f46ad8e0d16ad3dd4973
          make -C /tmp/libnx PREFIX="ccache aarch64-none-elf-"
          make -C /tmp/libnx install

      - name: Build network_mitm
        run: |
          set -euxo pipefail
          git submodule status
          git -C /tmp/libnx rev-parse HEAD
          make PREFIX="ccache aarch64-none-elf-" 2>&1 | tee build.log

      - name: Verify installer and produce checksums
        run: |
          set -euxo pipefail
          python3 .github/scripts/package.py --verify
          ls -lh out/*.zip out/SHA256SUMS.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network_mitm_build_log
          path: build.log
          if-no-files-found: ignore

      - name: Upload executable output
        uses: actions/upload-artifact@v4
        with:
          name: network_mitm_raw_output
          path: network_mitm/out/*
          if-no-files-found: error
          compression-level: 9

      - name: Upload SD installer
        uses: actions/upload-artifact@v4
        with:
          name: network_mitm_sd_install
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      # Publish an explicitly experimental pre-release only when this workflow
      # is started on the maintenance branch, after a full successful build.
      # Pull request checks never publish a release.
      - name: Publish HOS 23.0.1 pre-release
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/fix/hos-23.0.1-atmosphere-1.12' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.11-hos23.0.1-rc1
          name: network_mitm 0.2.11 — HOS 23.0.1 preview (unverified)
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Experimental binary built from fix/hos-23.0.1-atmosphere-1.12.
            Targets Atmosphère 1.12.0 with HOS 23.0.1.
            NOT validated on physical hardware; do not install on a primary console.
            Includes dependency alignment, non-fatal logging/capture I/O,
            PCAP file collision handling, and reduced ssl:s MITM scope.
            Back up SD before installing. To roll back, remove
            atmosphere/contents/4200000000000666 from SD.
          files: |
            out/*.zip
            out/SHA256SUMS.txt
